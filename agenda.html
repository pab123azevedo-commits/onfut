<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Onfut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
  :root{
    --bg:#0B1D15; --bg-2:#122A1F; --bg-3:#173322; --line:rgba(244,242,233,0.08);
    --turf:#5EB16B; --chalk:#F4F2E9; --muted:#8FA69A; --flood:#EFAE4C; --danger:#E58A8A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.24);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.28), 0 2px 6px rgba(0,0,0,0.2);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.45), 0 8px 20px rgba(0,0,0,0.3);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:
      radial-gradient(1200px 480px at 50% -10%, rgba(94,177,107,0.10), transparent 60%),
      var(--bg);
    color:var(--chalk); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;
    letter-spacing:-0.005em;
  }
  h1,h2,h3{ font-family:'Oswald', sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .wrap{ max-width:600px; margin:0 auto; padding:0 24px 80px; }
  button, input, select{ font-family:'Work Sans', sans-serif; }
  button{ transition:transform 0.15s var(--ease), opacity 0.15s var(--ease), background 0.15s var(--ease), border-color 0.15s var(--ease); }
  button:active{ transform:scale(0.96); }

  nav{
    padding:16px 0; position:sticky; top:0; z-index:20;
    background:rgba(11,29,21,0.72); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-bottom:1px solid var(--line);
  }
  nav .inner{ max-width:1080px; margin:0 auto; padding:0 24px; display:flex; justify-content:space-between; align-items:center; }
  .brand{ font-family:'Oswald', sans-serif; font-size:18px; font-weight:600; letter-spacing:-0.01em; }
  .brand span{ color:var(--flood); }
  .backlink{ color:var(--muted); font-size:13px; text-decoration:none; display:flex; align-items:center; gap:5px; transition:color 0.15s var(--ease); }
  .backlink:hover{ color:var(--chalk); }
  #sync-state{ font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; letter-spacing:0.01em; }
  #sync-state.ok{ color:var(--turf); }
  #sync-state.err{ color:var(--danger); }
  #logout-btn{ font-size:12px; font-weight:500; color:var(--muted); background:var(--bg-2); border:1px solid var(--line); border-radius:20px; padding:7px 14px; cursor:pointer; }
  #logout-btn:hover{ color:var(--danger); }

  /* login screen */
  .auth-wrap{ max-width:360px; margin:min(14vh,120px) auto 40px; padding:0 24px; }
  .auth-card{
    background:linear-gradient(180deg, var(--bg-2), var(--bg-3) 130%);
    border:1px solid var(--line); border-radius:22px; padding:32px 28px;
    box-shadow:var(--shadow-lg);
  }
  .auth-mark{
    width:44px; height:44px; border-radius:13px; margin-bottom:18px;
    background:linear-gradient(155deg, rgba(239,174,76,0.22), rgba(239,174,76,0.06));
    border:1px solid rgba(239,174,76,0.25);
    display:flex; align-items:center; justify-content:center; font-size:19px; color:var(--flood);
  }
  .auth-card h2{ font-size:24px; margin-bottom:6px; }
  .auth-card p.sub{ font-size:14px; color:var(--muted); margin:0 0 24px; line-height:1.45; }
  .auth-card input{
    width:100%; margin-bottom:11px; background:rgba(0,0,0,0.18); border:1px solid var(--line);
    color:var(--chalk); padding:13px 15px; border-radius:13px; font-size:15px;
    transition:border-color 0.15s var(--ease), background 0.15s var(--ease);
  }
  .auth-card input::placeholder{ color:var(--muted); }
  .auth-card input:focus{ outline:none; border-color:var(--turf); background:rgba(0,0,0,0.28); box-shadow:0 0 0 3px rgba(94,177,107,0.16); }
  :focus-visible{ outline:2px solid var(--turf); outline-offset:2px; border-radius:4px; }
  .auth-card button.primary{
    width:100%; background:var(--flood); color:#231600; border:none; font-weight:600; font-size:15px;
    padding:14px; border-radius:13px; cursor:pointer; margin-top:6px; box-shadow:0 4px 14px rgba(239,174,76,0.25);
  }
  .auth-card button.primary:hover{ background:#f4bb63; }
  .auth-toggle{ text-align:center; font-size:13px; color:var(--muted); margin-top:20px; }
  .auth-toggle a{ color:var(--turf); cursor:pointer; text-decoration:none; font-weight:500; }
  .auth-toggle a:hover{ text-decoration:underline; }
  .auth-error{ display:none; font-size:13px; color:var(--danger); background:rgba(229,138,138,0.1); border-radius:11px; padding:11px 14px; margin-bottom:14px; line-height:1.4; }
  .hidden{ display:none !important; }

  .header{ position:relative; padding:56px 0 28px; text-align:center; overflow:hidden; }
  .header::before{
    content:''; position:absolute; top:-160px; left:50%; transform:translateX(-50%);
    width:640px; height:380px;
    background:radial-gradient(ellipse at center, rgba(239,174,76,0.14) 0%, rgba(239,174,76,0) 72%);
    pointer-events:none;
  }
  .header-inner{ position:relative; }
  .tabs{ display:flex; gap:6px; justify-content:center; margin-bottom:28px; background:var(--bg-2); border:1px solid var(--line); border-radius:16px; padding:4px; width:fit-content; margin-left:auto; margin-right:auto; }
  .tab{ font-size:13px; font-weight:500; padding:8px 18px; border-radius:12px; border:none; background:transparent; color:var(--muted); cursor:pointer; }
  .tab.active{ background:var(--bg-3); color:var(--chalk); box-shadow:var(--shadow-sm); }

  .date-big{ font-family:'Oswald', sans-serif; font-size:46px; line-height:1; letter-spacing:-0.02em; }
  .date-sub{ font-size:14px; color:var(--muted); margin-top:8px; }
  .date-sub .dot{ color:var(--turf); }

  .strip{ display:flex; justify-content:center; gap:8px; margin-top:26px; }
  .chip{
    width:44px; padding:9px 0; border-radius:13px; border:1px solid transparent;
    background:var(--bg-2); cursor:pointer; text-align:center; color:var(--muted);
    transition:background 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .chip .dow{ font-size:10px; text-transform:uppercase; letter-spacing:0.04em; }
  .chip .num{ font-family:'Oswald', sans-serif; font-size:16px; color:var(--chalk); margin-top:2px; }
  .chip.active{ border-color:var(--flood); background:rgba(239,174,76,0.12); box-shadow:var(--shadow-sm); }
  .chip.active .dow{ color:var(--flood); }
  .chip.has-late::after{ content:''; display:block; width:4px; height:4px; border-radius:50%; background:var(--danger); margin:5px auto 0; }

  .summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:32px 0 26px; }
  .summary .cell{ background:var(--bg-2); border:1px solid var(--line); border-radius:16px; padding:16px 10px; text-align:center; box-shadow:var(--shadow-sm); }
  .summary .val{ font-family:'Oswald', sans-serif; font-size:20px; letter-spacing:-0.01em; }
  .summary .val.danger{ color:var(--danger); }
  .summary .lbl{ font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:0.01em; }

  .legend{ display:flex; gap:16px; font-size:12px; color:var(--muted); margin-bottom:16px; flex-wrap:wrap; padding:0 2px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  .list{ display:flex; flex-direction:column; gap:8px; min-height:60px; }
  @keyframes itemIn{ from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:none; } }
  .item{
    display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer;
    background:var(--bg-2); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm);
    transition:transform 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s var(--ease);
    animation:itemIn 0.32s var(--ease) backwards;
  }
  .item:hover{ background:var(--bg-3); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .item:active{ transform:translateY(0) scale(0.99); }
  .item .time{ font-family:'Oswald', sans-serif; font-size:15px; width:50px; letter-spacing:-0.01em; }
  .item .icon{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .icon-paid{ background:rgba(94,177,107,0.16); color:#8fd39c; }
  .icon-pending{ background:rgba(239,174,76,0.16); color:var(--flood); }
  .icon-late{ background:rgba(229,138,138,0.16); color:var(--danger); }
  .icon-blocked{ background:var(--bg-3); color:var(--muted); }
  .icon-livre{ background:transparent; color:var(--muted); border:1px dashed var(--line); }
  .item .main{ flex:1; min-width:0; }
  .item .main .name{ font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .main .sub{ font-size:12px; color:var(--muted); margin-top:1px; }
  .tag{ font-size:11px; padding:5px 11px; border-radius:20px; white-space:nowrap; font-weight:500; }
  .tag-paid{ background:rgba(94,177,107,0.16); color:#8fd39c; }
  .tag-pending{ background:rgba(239,174,76,0.16); color:var(--flood); }
  .tag-late{ background:rgba(229,138,138,0.16); color:var(--danger); }
  .tag-blocked{ background:var(--bg-3); color:var(--muted); }
  .tag-livre{ background:transparent; color:var(--muted); border:1px dashed var(--line); }

  #modal-layer{ position:relative; }
  .modal-bg{
    min-height:300px; background:rgba(5,12,9,0.65); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; margin-top:16px; border-radius:16px;
    animation:fadeIn 0.18s var(--ease);
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .modal-card{
    background:linear-gradient(180deg, var(--bg-2), var(--bg-3) 130%);
    border:1px solid var(--line); border-radius:20px; padding:24px; width:288px;
    box-shadow:var(--shadow-lg);
    animation:riseIn 0.22s var(--ease);
  }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(8px) scale(0.98); } to{ opacity:1; transform:none; } }
  .modal-card input, .modal-card select{
    width:100%; margin-bottom:10px; background:rgba(0,0,0,0.18); border:1px solid var(--line);
    color:var(--chalk); padding:11px 13px; border-radius:12px; font-size:14px;
    transition:border-color 0.15s var(--ease);
  }
  .modal-card input:focus, .modal-card select:focus{ outline:none; border-color:var(--turf); }
  .modal-card button{ font-weight:600; font-size:13px; padding:11px 16px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--chalk); cursor:pointer; }
  .modal-card button.primary{ background:var(--flood); color:#231600; border:none; }
  .modal-card button.primary:hover{ background:#f4bb63; }
  .modal-card button.danger{ color:var(--danger); border-color:rgba(229,138,138,0.3); }
  .modal-card button.danger:hover{ background:rgba(229,138,138,0.1); }
  .modal-label{ font-size:12px; color:var(--muted); margin-bottom:16px; letter-spacing:0.01em; }
  .modal-error{ display:none; font-size:12px; color:var(--danger); margin-bottom:8px; }
  .modal-note{ font-size:12px; color:var(--muted); margin:0 0 14px; padding:12px; background:rgba(0,0,0,0.18); border-radius:12px; line-height:1.5; }
</style>
</head>
<body>

<nav><div class="inner">
  <div class="brand">On<span>fut</span></div>
  <div style="display:flex; align-items:center; gap:18px;">
    <span id="sync-state" class="hidden"><i class="ti ti-loader-2"></i> conectando…</span>
    <button id="logout-btn" class="hidden">Sair</button>
    <a class="backlink" href="index.html"><i class="ti ti-arrow-left"></i>voltar para o site</a>
  </div>
</div></nav>

<!-- TELA DE LOGIN -->
<div class="auth-wrap" id="auth-screen">
  <div class="auth-card">
    <div class="auth-mark"><i class="ti ti-bulb-filled"></i></div>
    <h2 id="auth-title">Entrar</h2>
    <p class="sub" id="auth-sub">Acesse a agenda da sua quadra.</p>
    <p class="auth-error" id="auth-error"></p>
    <input id="auth-email" type="email" placeholder="E-mail" />
    <input id="auth-pass" type="password" placeholder="Senha (mínimo 6 caracteres)" />
    <button class="primary" id="auth-submit" onclick="submitAuth()">Entrar</button>
    <p class="auth-toggle">
      <span id="auth-toggle-text">Ainda não tem conta?</span>
      <a onclick="toggleAuthMode()" id="auth-toggle-link">Criar conta</a>
    </p>
  </div>
</div>

<!-- APP (só aparece logado) -->
<div id="app-screen" class="hidden">
  <div class="header"><div class="wrap header-inner">
    <div class="tabs" id="quadra-tabs"></div>
    <div class="date-big" id="date-big"></div>
    <div class="date-sub" id="date-sub"></div>
    <div class="strip" id="day-strip"></div>
  </div></div>

  <div class="wrap">
    <div class="summary" id="summary"></div>

    <div class="legend">
      <span><span class="swatch" style="background:#8fd39c;"></span>Pago</span>
      <span><span class="swatch" style="background:var(--flood);"></span>Pendente</span>
      <span><span class="swatch" style="background:var(--danger);"></span>Atrasado</span>
      <span><span class="swatch" style="background:var(--line);"></span>Livre</span>
      <span><i class="ti ti-repeat" style="font-size:12px;"></i> Mensalista</span>
    </div>

    <div class="list" id="list"></div>
    <div id="modal-layer"></div>
  </div>
</div>

<script>
/* ---------- setup ---------- */
const dows = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const dowsShort = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const months = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const hours = []; for (let h=15; h<=23; h++) hours.push(h);
function fmt(h){ return h+':00'; }
function price(h){ return h>=18 ? 140 : 90; }
function dateISO(d){ return d.toISOString().slice(0,10); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

const quadras = ['Quadra 1','Quadra 2'];
let currentQuadra = 0;
let currentDate = new Date(); currentDate.setHours(0,0,0,0);

let mensalistas = [];
let reservasDoDia = {};
let reservasUnsub = null;
let currentUser = null;

/* ---------- autenticação ---------- */
const auth = firebase.auth();
let authMode = 'login'; // 'login' | 'signup'

function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('auth-title').textContent = authMode === 'login' ? 'Entrar' : 'Criar conta';
  document.getElementById('auth-submit').textContent = authMode === 'login' ? 'Entrar' : 'Criar conta';
  document.getElementById('auth-toggle-text').textContent = authMode === 'login' ? 'Ainda não tem conta?' : 'Já tem conta?';
  document.getElementById('auth-toggle-link').textContent = authMode === 'login' ? 'Criar conta' : 'Entrar';
  document.getElementById('auth-error').style.display = 'none';
}

async function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!email || !pass){ errEl.textContent = 'Preencha e-mail e senha.'; errEl.style.display='block'; return; }

  try{
    if (authMode === 'login'){
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      await auth.createUserWithEmailAndPassword(email, pass);
    }
  } catch(e){
    errEl.textContent = traduzErro(e.code);
    errEl.style.display = 'block';
  }
}

function traduzErro(code){
  const map = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-not-found': 'Não existe conta com esse e-mail.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Já existe conta com esse e-mail — tenta entrar em vez de criar.',
    'auth/weak-password': 'Senha muito curta (mínimo 6 caracteres).'
  };
  return map[code] || 'Não foi possível completar. Tente novamente.';
}

document.getElementById('logout-btn').onclick = ()=> auth.signOut();

auth.onAuthStateChanged(user=>{
  currentUser = user;
  if (user){
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('sync-state').classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('hidden');
    listenMensalistas();
    listenReservasDoDia();
    renderAll();
  } else {
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
    document.getElementById('sync-state').classList.add('hidden');
    document.getElementById('logout-btn').classList.add('hidden');
    if (reservasUnsub) reservasUnsub();
    mensalistas = []; reservasDoDia = {};
  }
});

/* ---------- conexão com o Firestore (dados só do dono logado, via ownerId) ---------- */
function setSyncState(state){
  const el = document.getElementById('sync-state');
  el.classList.remove('ok','err');
  if (state === 'ok'){ el.innerHTML = '<i class="ti ti-cloud-check"></i> sincronizado'; el.classList.add('ok'); }
  else if (state === 'err'){ el.innerHTML = '<i class="ti ti-cloud-off"></i> sem conexão com o banco'; el.classList.add('err'); }
  else { el.innerHTML = '<i class="ti ti-loader-2"></i> conectando…'; }
}

function listenMensalistas(){
  db.collection('mensalistas').where('ownerId','==', currentUser.uid).onSnapshot(snap=>{
    mensalistas = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    setSyncState('ok');
    renderAll();
  }, err=>{ console.error(err); setSyncState('err'); });
}

function listenReservasDoDia(){
  if (reservasUnsub) reservasUnsub();
  reservasDoDia = {};
  reservasUnsub = db.collection('reservas')
    .where('ownerId','==', currentUser.uid)
    .where('quadraIdx','==',currentQuadra)
    .where('dateISO','==',dateISO(currentDate))
    .onSnapshot(snap=>{
      reservasDoDia = {};
      snap.forEach(doc => { reservasDoDia[doc.data().hour] = { id:doc.id, ...doc.data() }; });
      renderAll();
    }, err=>{ console.error(err); setSyncState('err'); });
}

/* ---------- lógica de horário (bloqueio de conflito) ---------- */
function getSlot(date, quadraIdx, hour){
  if (quadraIdx === currentQuadra && dateISO(date) === dateISO(currentDate)){
    const ov = reservasDoDia[hour];
    if (ov) return ov;
  }
  const rule = mensalistas.find(m => m.quadraIdx === quadraIdx && m.dow === date.getDay() && m.hour === hour);
  if (rule){
    const paidMonths = rule.paidMonths || [];
    const pay = paidMonths.includes(monthKey(date)) ? 'pago' : (date.getDate() > (rule.diaVencimento||10) ? 'atrasado' : 'pendente');
    return { status:'ocupado', tipo:'mensalista', name:rule.name, phone:rule.phone||'', pay, ruleId:rule.id };
  }
  return { status:'livre' };
}

function dayHasLate(date, quadraIdx){
  return hours.some(h => getSlot(date, quadraIdx, h).pay === 'atrasado');
}
function isSameDay(a,b){ return a.toDateString() === b.toDateString(); }

/* ---------- render ---------- */
function renderTabs(){
  const el = document.getElementById('quadra-tabs');
  el.innerHTML = '';
  quadras.forEach((q,i)=>{
    const b = document.createElement('button');
    b.className = 'tab' + (i===currentQuadra ? ' active' : '');
    b.textContent = q;
    b.onclick = ()=>{ currentQuadra = i; listenReservasDoDia(); renderAll(); };
    el.appendChild(b);
  });
}

function renderStrip(){
  const el = document.getElementById('day-strip');
  el.innerHTML = '';
  for (let i=-2; i<=4; i++){
    const d = new Date(currentDate); d.setDate(d.getDate()+i);
    const chip = document.createElement('button');
    chip.className = 'chip' + (isSameDay(d,currentDate) ? ' active' : '') + (dayHasLate(d,currentQuadra) ? ' has-late' : '');
    chip.innerHTML = '<div class="dow">'+dowsShort[d.getDay()]+'</div><div class="num">'+d.getDate()+'</div>';
    chip.onclick = ()=>{ currentDate = d; listenReservasDoDia(); renderAll(); };
    el.appendChild(chip);
  }
}

function renderHeader(){
  const isToday = isSameDay(currentDate, new Date());
  document.getElementById('date-big').textContent = currentDate.getDate() + ' de ' + months[currentDate.getMonth()];
  document.getElementById('date-sub').innerHTML = dows[currentDate.getDay()] + (isToday ? ' <span class="dot">·</span> hoje' : '');
}

function renderSummary(){
  let ocupados=0, faturamento=0, atraso=0;
  hours.forEach(h=>{
    const e = getSlot(currentDate, currentQuadra, h);
    if (e.status === 'ocupado'){
      ocupados++;
      if (e.pay === 'atrasado') atraso += price(h); else if (e.pay === 'pago') faturamento += price(h);
    }
  });
  document.getElementById('summary').innerHTML = `
    <div class="cell"><div class="val">${ocupados}/${hours.length}</div><div class="lbl">horários ocupados</div></div>
    <div class="cell"><div class="val">R$${faturamento}</div><div class="lbl">recebido no dia</div></div>
    <div class="cell"><div class="val ${atraso>0?'danger':''}">R$${atraso}</div><div class="lbl">em atraso</div></div>`;
}

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  hours.forEach((h, idx)=>{
    const entry = getSlot(currentDate, currentQuadra, h);
    let iconClass='icon-livre', tagClass='tag-livre', tagLabel='Livre', icon='ti-plus';
    let name='Horário livre', sub='R$'+price(h);

    if (entry.status === 'ocupado'){
      name = entry.name; sub = entry.phone || '';
      if (entry.tipo === 'mensalista') icon = 'ti-repeat';
      if (entry.pay === 'pago'){ iconClass='icon-paid'; tagClass='tag-paid'; tagLabel='Pago'; if(entry.tipo!=='mensalista') icon='ti-check'; }
      else if (entry.pay === 'pendente'){ iconClass='icon-pending'; tagClass='tag-pending'; tagLabel='Pendente'; if(entry.tipo!=='mensalista') icon='ti-clock'; }
      else { iconClass='icon-late'; tagClass='tag-late'; tagLabel='Atrasado'; if(entry.tipo!=='mensalista') icon='ti-alert-triangle'; }
      if (entry.tipo === 'mensalista') sub = (sub ? sub + ' · ' : '') + 'mensalista';
    } else if (entry.status === 'bloqueado'){
      name='Bloqueado'; sub='Manutenção'; iconClass='icon-blocked'; tagClass='tag-blocked'; tagLabel='Bloqueado'; icon='ti-lock';
    }

    const row = document.createElement('div');
    row.className = 'item';
    row.style.animationDelay = Math.min(idx * 16, 160) + 'ms';
    row.innerHTML = `
      <div class="time">${fmt(h)}</div>
      <div class="icon ${iconClass}"><i class="ti ${icon}"></i></div>
      <div class="main"><div class="name">${name}</div><div class="sub">${sub}</div></div>
      <span class="tag ${tagClass}">${tagLabel}</span>`;
    row.onclick = ()=> openModal(h, entry);
    list.appendChild(row);
  });
}

function renderAll(){ renderTabs(); renderStrip(); renderHeader(); renderSummary(); renderList(); }

/* ---------- modal ---------- */
function openModal(h, entry){
  const layer = document.getElementById('modal-layer');
  const label = dows[currentDate.getDay()] + ' ' + currentDate.getDate() + ' ' + months[currentDate.getMonth()] + ' · ' + fmt(h) + ' · ' + quadras[currentQuadra];
  let body;

  if (entry.status === 'livre'){
    body = `
      <p class="modal-label">${label} — livre</p>
      <select id="m-tipo" onchange="toggleMensalistaField()">
        <option value="avulso">Avulso</option>
        <option value="mensalista">Mensalista (fixo toda semana)</option>
        <option value="bloqueado">Bloquear horário</option>
      </select>
      <input id="m-name" placeholder="Nome do time ou cliente" />
      <input id="m-phone" placeholder="(47) 9 0000-0000" />
      <select id="m-pay">
        <option value="pendente">Pendente</option>
        <option value="pago">Pago</option>
      </select>
      <input id="m-venc" class="hidden" type="number" min="1" max="28" placeholder="Dia do vencimento mensal (ex: 5)" />
      <p class="modal-error" id="m-err">Informe o nome antes de salvar.</p>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeModal()">Cancelar</button>
        <button class="primary" onclick="saveEntry(${h})">Salvar</button>
      </div>`;
  } else if (entry.status === 'ocupado' && entry.tipo === 'mensalista'){
    body = `
      <p class="modal-label">${label} — mensalista fixo</p>
      <p style="font-weight:500; margin:0 0 4px;">${entry.name}</p>
      <p style="font-size:13px; color:var(--muted); margin:0 0 16px;">${entry.phone || 'sem telefone'} · status: ${entry.pay}</p>
      <div class="modal-note">Esse horário é reservado todo(a) ${dows[currentDate.getDay()]} automaticamente. Não dá pra criar um avulso em cima sem antes liberar só esse dia ou remover o mensalista.</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="primary" onclick="markPaid('${entry.ruleId}')">Marcar mês como pago</button>
        <button onclick="cancelOneDay(${h})">Liberar só esse dia</button>
        <button class="danger" onclick="removeMensalista('${entry.ruleId}')">Remover mensalista</button>
        <button onclick="closeModal()">Fechar</button>
      </div>`;
  } else if (entry.status === 'ocupado'){
    body = `
      <p class="modal-label">${label} — avulso</p>
      <p style="font-weight:500; margin:0 0 4px;">${entry.name}</p>
      <p style="font-size:13px; color:var(--muted); margin:0 0 16px;">${entry.phone || ''}</p>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeModal()">Fechar</button>
        <button class="primary" onclick="freeSlot('${entry.id}')">Liberar horário</button>
      </div>`;
  } else {
    body = `
      <p class="modal-label">${label} — bloqueado</p>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeModal()">Fechar</button>
        <button class="primary" onclick="freeSlot('${entry.id}')">Desbloquear</button>
      </div>`;
  }
  layer.innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal-card">${body}</div></div>`;
}

function toggleMensalistaField(){
  const tipo = document.getElementById('m-tipo').value;
  document.getElementById('m-venc').classList.toggle('hidden', tipo !== 'mensalista');
}

function closeModal(){ document.getElementById('modal-layer').innerHTML = ''; }

async function saveEntry(h){
  const tipo = document.getElementById('m-tipo').value;
  const name = document.getElementById('m-name').value.trim();
  const err = document.getElementById('m-err');
  if (tipo !== 'bloqueado' && !name){ err.style.display='block'; return; }
  err.style.display = 'none';
  const phone = document.getElementById('m-phone').value.trim();

  try{
    if (tipo === 'mensalista'){
      const venc = parseInt(document.getElementById('m-venc').value, 10) || 10;
      await db.collection('mensalistas').add({
        ownerId: currentUser.uid,
        quadraIdx: currentQuadra, dow: currentDate.getDay(), hour: h,
        name, phone, diaVencimento: venc, paidMonths: []
      });
    } else {
      const pay = tipo === 'bloqueado' ? null : document.getElementById('m-pay').value;
      await db.collection('reservas').add({
        ownerId: currentUser.uid,
        quadraIdx: currentQuadra, dateISO: dateISO(currentDate), hour: h,
        status: tipo === 'bloqueado' ? 'bloqueado' : 'ocupado',
        tipo: tipo === 'bloqueado' ? null : 'avulso',
        name: tipo === 'bloqueado' ? 'Bloqueado' : name, phone, pay
      });
    }
    closeModal();
  } catch(e){ console.error(e); alert('Não foi possível salvar — confira a conexão com o Firebase.'); }
}

async function freeSlot(docId){
  try{ await db.collection('reservas').doc(docId).delete(); closeModal(); }
  catch(e){ console.error(e); alert('Não foi possível liberar — confira a conexão com o Firebase.'); }
}

async function cancelOneDay(h){
  try{
    await db.collection('reservas').add({
      ownerId: currentUser.uid,
      quadraIdx: currentQuadra, dateISO: dateISO(currentDate), hour: h, status:'livre'
    });
    closeModal();
  } catch(e){ console.error(e); alert('Não foi possível liberar esse dia.'); }
}

async function removeMensalista(ruleId){
  if (!confirm('Remover esse mensalista definitivamente? Isso apaga o horário fixo de todas as semanas futuras.')) return;
  try{ await db.collection('mensalistas').doc(ruleId).delete(); closeModal(); }
  catch(e){ console.error(e); alert('Não foi possível remover.'); }
}

async function markPaid(ruleId){
  try{
    await db.collection('mensalistas').doc(ruleId).update({
      paidMonths: firebase.firestore.FieldValue.arrayUnion(monthKey(currentDate))
    });
    closeModal();
  } catch(e){ console.error(e); alert('Não foi possível marcar como pago.'); }
}
</script>
</body>
</html>
